<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - TeamMatch PNC</title>
    <!-- Google Fonts & External Stylesheet -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="auth-wrapper">
      <div class="auth-card">
        <!-- Logo & Header -->
        <div class="auth-header">
          <div class="auth-logo-badge">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="28"
              height="28"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2" />
              <circle cx="9" cy="7" r="4" />
              <path d="M22 21v-2a4 4 0 0 0-3-3.87" />
              <path d="M16 3.13a4 4 0 0 1 0 7.75" />
            </svg>
          </div>
          <h1 class="auth-title">TeamMatch <span>PNC</span></h1>
          <p class="auth-subtitle">
            Platform Pencocokan Tim & Kolaborasi Lomba Mahasiswa
          </p>
        </div>

        <!-- Form Login -->
        <form action="dashboard.html" method="get">
          <div class="form-group" style="margin-bottom: 18px;">
            <label class="form-label" for="username">
              Username <span class="req-star">*</span>
            </label>
            <div class="input-wrapper">
              <span class="input-icon">
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  width="18"
                  height="18"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2" />
                  <circle cx="12" cy="7" r="4" />
                </svg>
              </span>
              <input
                id="username"
                class="form-control has-icon"
                type="text"
                name="username"
                placeholder="Masukan NIM atau username"
                required
              />
            </div>
          </div>

          <div class="form-group" style="margin-bottom: 24px;">
            <label class="form-label" for="password">
              Password <span class="req-star">*</span>
            </label>
            <div class="input-wrapper">
              <span class="input-icon">
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  width="18"
                  height="18"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <rect width="18" height="11" x="3" y="11" rx="2" ry="2" />
                  <path d="M7 11V7a5 5 0 0 1 10 0v4" />
                </svg>
              </span>
              <input
                id="password"
                class="form-control has-icon"
                type="password"
                name="password"
                placeholder="Masukan kata sandi"
                required
              />
            </div>
          </div>

          <button type="submit" class="btn btn-primary btn-block">
            <span>Masuk ke Dashboard</span>
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M5 12h14" />
              <path d="m12 5 7 7-7 7" />
            </svg>
          </button>
        </form>

        <!-- Footer -->
        <div class="auth-footer">
          <p>© 2026 Politeknik Negeri Cilacap (PNC)</p>
          <p style="margin-top: 4px; color: var(--text-light);">
            Inovasi & Prestasi Mahasiswa Berkelanjutan
          </p>
        </div>
      </div>
    </div>
  </body>
</html>
