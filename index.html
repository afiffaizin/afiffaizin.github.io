<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login Page</title>
  </head>
  <body bgcolor="#f4f7f6" text="black">
    <br /><br /><br /><br /><br /><br />
    <table
      align="center"
      bgcolor="#ffffff"
      cellpadding="40"
      cellspacing="0"
      width="450"
    >
      <tr>
        <td>
          <center>
            <font size="6">
              <b>Halaman Login</b>
            </font>
            <br /><br /><br />
          </center>
          <form action="dashboard.html" method="post">
            <font size="3">
              <table width="100%" cellpadding="10" cellspacing="0" border="0">
                <tr>
                  <td width="30%" align="right"><b>Username:</b></td>
                  <td>
                    <input
                      type="text"
                      name="username"
                      placeholder="Masukan username anda"
                      size="25"
                      required
                    />
                  </td>
                </tr>
                <tr>
                  <td align="right"><b>Password:</b></td>
                  <td>
                    <input
                      type="password"
                      name="password"
                      placeholder="Masukan password anda"
                      size="25"
                      required
                    />
                  </td>
                </tr>
              </table>
              <br /><br />
              <center>
                <input type="submit" value="        Login        " />
              </center>
            </font>
          </form>
        </td>
      </tr>
    </table>
  </body>
</html>
